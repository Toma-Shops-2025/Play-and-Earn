name: Process PayPal payouts

on:
  schedule:
    # Every 15 minutes (UTC)
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  payouts:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger payout worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Skip: SUPABASE_URL or CRON_SECRET not configured in repo secrets"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            "${SUPABASE_URL}/functions/v1/process-pending-payouts"
